# Homebrew JDKs are not necessarily registered with macOS java_home.
# Other installations are still found through Gradle's normal auto-detection.
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Run the compiler inside the pinned Gradle JVM instead of reusing a Kotlin daemon on JDK 25.
kotlin.compiler.execution.strategy=in-process
